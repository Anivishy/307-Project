<title>Login Page</title>
<rect x="0" y="0" width="1440" height="1024" fill="#FAF8F2"/><rect x="0" y="0" width="590" height="1024" fill="url(#warmHero)"/><rect x="0" y="0" width="590" height="1024" fill="url(#dotGrid)" opacity="0.45"/><circle cx="94" cy="86" r="22" fill="#E9F7F3" stroke="#2A9D8F" stroke-width="1.5"/><g transform="translate(82 74) scale(1)"><path stroke="#1F7A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M5 19C12 19 19 12 19 5C12 5 5 12 5 19Z"/><path stroke="#1F7A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M5 19C9 15 13 11 19 5"/></g><text x="128" y="94" fill="#1F2933" font-size="22" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="128" dy="0">RecipeCollab</tspan></text><text x="76" y="210" fill="#1F2933" font-size="52" font-weight="900" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="76" dy="0">Your group dinner</tspan><tspan x="76" dy="60">starts with login.</tspan></text><text x="80" y="352" fill="#4C3A51" font-size="19" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="80" dy="0">Secure access keeps personal pantry data private</tspan><tspan x="80" dy="29">while still making group recipes easy.</tspan></text><rect x="96" y="486" width="398" height="244" rx="8" fill="#FFFFFF" stroke="#D6D9DE" stroke-width="1"/><text x="128" y="534" fill="#1F2933" font-size="22" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="128" dy="0">Tonight's quick flow</tspan></text><circle cx="130" cy="577" r="16" fill="#E9F7F3" stroke="#2A9D8F" stroke-width="1"/><text x="130" y="583" fill="#1F7A70" font-size="13" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0" text-anchor="middle"><tspan x="130" dy="0">1</tspan></text><text x="162" y="576" fill="#1F2933" font-size="16" font-weight="800" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="162" dy="0">Sign in</tspan></text><text x="162" y="598" fill="#6B7280" font-size="13" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="162" dy="0">Session keeps your pantry available</tspan></text><circle cx="130" cy="625" r="16" fill="#EF6351" stroke="#C84B3D" stroke-width="1"/><text x="130" y="631" fill="#FFFFFF" font-size="13" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0" text-anchor="middle"><tspan x="130" dy="0">2</tspan></text><text x="162" y="624" fill="#1F2933" font-size="16" font-weight="800" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="162" dy="0">Pick group</tspan></text><text x="162" y="646" fill="#6B7280" font-size="13" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="162" dy="0">Choose the people cooking together</tspan></text><circle cx="130" cy="673" r="16" fill="#E9F7F3" stroke="#2A9D8F" stroke-width="1"/><text x="130" y="679" fill="#1F7A70" font-size="13" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0" text-anchor="middle"><tspan x="130" dy="0">3</tspan></text><text x="162" y="672" fill="#1F2933" font-size="16" font-weight="800" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="162" dy="0">Approve use</tspan></text><text x="162" y="694" fill="#6B7280" font-size="13" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="162" dy="0">Control what ingredients can be used</tspan></text><rect x="770" y="136" width="480" height="690" rx="8" fill="#FFFFFF" stroke="#D6D9DE" stroke-width="1"/><text x="830" y="210" fill="#1F2933" font-size="34" font-weight="900" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="830" dy="0">Welcome back</tspan></text><text x="832" y="246" fill="#6B7280" font-size="17" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="832" dy="0">Log in to access your recipes and groups.</tspan></text><text x="830" y="316" fill="#1F2933" font-size="14" font-weight="700" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="830" dy="0">Email address</tspan></text><rect x="830" y="326" width="360" height="58" rx="8" fill="#FFFFFF" stroke="#D6D9DE" stroke-width="1.5"/><g transform="translate(848 344) scale(0.9166666666666666)"><rect stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" x="3" y="5" width="18" height="14" rx="2"/><path stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M4 7L12 13L20 7"/></g><text x="882" y="361" fill="#1F2933" font-size="16" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="882" dy="0">kartik@example.com</tspan></text><text x="830" y="416" fill="#1F2933" font-size="14" font-weight="700" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="830" dy="0">Password</tspan></text><rect x="830" y="426" width="360" height="58" rx="8" fill="#FFFFFF" stroke="#D6D9DE" stroke-width="1.5"/><g transform="translate(848 444) scale(0.9166666666666666)"><rect stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" x="5" y="10" width="14" height="11" rx="2"/><path stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10"/></g><text x="882" y="461" fill="#1F2933" font-size="16" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="882" dy="0">********</tspan></text><rect x="830" y="516" width="20" height="20" rx="5" fill="#2A9D8F"/><g transform="translate(831 514) scale(0.75)"><path stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M5 13L10 18L20 6"/></g><text x="862" y="532" fill="#1F2933" font-size="15" font-weight="650" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="862" dy="0">Remember me</tspan></text><text x="1080" y="532" fill="#EF6351" font-size="15" font-weight="800" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="1080" dy="0">Forgot?</tspan></text><rect x="830" y="578" width="360" height="56" rx="8" fill="#2A9D8F" stroke-width="1"/><g transform="translate(848 595) scale(0.9166666666666666)"><rect stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" x="5" y="10" width="14" height="11" rx="2"/><path stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M8 10V7C8 4.8 9.8 3 12 3C14.2 3 16 4.8 16 7V10"/></g><text x="880" y="612" fill="#FFFFFF" font-size="16" font-weight="800" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="880" dy="0">Sign In</tspan></text><rect x="830" y="660" width="360" height="54" rx="8" fill="#E9F7F3" stroke="#B9E5DE" stroke-width="1"/><g transform="translate(852 675) scale(0.9166666666666666)"><path stroke="#1F7A70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M5 13L10 18L20 6"/></g><text x="886" y="683" fill="#1F7A70" font-size="14" font-weight="700" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="886" dy="0">Login success keeps routing to dashboard.</tspan></text><line x1="830" y1="750" x2="1190" y2="750" stroke="#D6D9DE" stroke-width="1" stroke-linecap="round"/><text x="912" y="786" fill="#EF6351" font-size="15" font-weight="800" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="912" dy="0">New here? Create account</tspan></text>
</svg>
