<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="Login Page">

    <defs>
      <linearGradient id="warmHero" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#FDEEEA"/>
        <stop offset="0.48" stop-color="#E9F7F3"/>
        <stop offset="1" stop-color="#FFF4D7"/>
      </linearGradient>
      <linearGradient id="sidebarGrad" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#263743"/>
        <stop offset="1" stop-color="#1E2933"/>
      </linearGradient>
      <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
