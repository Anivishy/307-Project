round" stroke-linejoin="round" fill="none" cx="17" cy="10" r="2.5"/><path stroke="#4C3A51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M3.5 21C4.7 17.2 6.8 15 9.5 15C12.2 15 14.3 17.2 15.5 21"/><path stroke="#4C3A51" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M14 16C16.7 16 18.8 17.7 20.5 21"/></g><text x="586" y="742" fill="#1F2933" font-size="22" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="586" dy="0">Join a group</tspan></text><text x="586" y="778" fill="#6B7280" font-size="16" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="586" dy="0">See members, shared ingredients, and dinner plans.</tspan></text><rect x="932" y="698" width="372" height="194" rx="8" fill="#FFFFFF" stroke="#D6D9DE" stroke-width="1"/><circle cx="978" cy="746" r="26" fill="#FDEEEA" stroke="#C84B3D" stroke-width="1"/><g transform="translate(966 734) scale(1)"><path stroke="#C84B3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M12 2L14.7 8.2L21 11L14.7 13.8L12 20L9.3 13.8L3 11L9.3 8.2Z"/></g><text x="1016" y="742" fill="#1F2933" font-size="22" font-weight="850" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="1016" dy="0">Generate together</tspan></text><text x="1016" y="778" fill="#6B7280" font-size="16" font-weight="500" font-family="Inter, SF Pro Display, Arial, sans-serif" letter-spacing="0"><tspan x="1016" dy="0">Use cuisine, allergy, and meal specs to get ideas.</tspan></text>
